---

# Grafana loki conifguration details
# More details can be found at https://grafana.com/docs/loki/latest/configuration/

# Verison of loki to be installed
loki_version: 2.4.1

# loki service user
loki_service_user: "loki"
loki_service_group: "{{ loki_service_user }}"

# loki config dir
loki_config_directory: "/etc/loki"

# loki debug level
loki_config_log_level: "debug"

# loki server config
loki_config_http_address: "{{ inventory_hostname }}"
loki_config_http_port: "3100"

# Disable authentification
loki_config_auth: false

# local storage where loki data will be stored
loki_config_store: "/var/lib/loki"

# retention period for the index
loki_config_period: "168h"
