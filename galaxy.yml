---

namespace: mahendrapaipuri
name: ansible_jupyterhub_hpc
version: "2.1.0"
readme: "README.md"
authors:
  - "Mahendra Paipuri <mahendra.paipuri@cnrs.fr>"
description: |
  Installs JupyterHub along with batchspawner on HPC platforms.
  The role additionally can deploy node exporter, Prometheus and
  Grafana stack to monitor the Jupyterhub deployment.
license:
  - "Apache-2.0"
tags:
  - jupyterhub
  - hpc
  - slurm
  - monitoring
  - prometheus
  - grafana
dependencies:
  "prometheus.prometheus": "0.27.3"
  "grafana.grafana": "6.0.3"
repository: "https://gitlab.com/idris-cnrs/jupyter/ansible-jupyterhub-hpc"
documentation: "https://gitlab.com/idris-cnrs/jupyter/ansible-jupyterhub-hpc/-/tree/main/docs"
issues: "https://gitlab.com/idris-cnrs/jupyter/ansible-jupyterhub-hpc/-/issues"
build_ignore:
  - .config
  - .github
  - .gitignore
  - .ansible
  - changelogs
  - molecule
  - tests
  - '*test-requirements.txt'
  - '*.tar.gz'
