---
# This playbook deploys JupyterHub.

- name: Validate environment
  hosts: localhost
  connection: local
  gather_facts: no
  roles:
    - env_validation
  tags: always

- name: Gather facts from all the nodes
  hosts: all

- name: Run common tasks
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - common
  tags: common

- name: Install jupyterhub servers
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - jupyter
  tags: jupyter

- name: Install nginx
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - nginx
  tags: nginx

- name: Configure jupyterhub
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - jupyterhub_config
  tags: jh_config

- name: Start jupyterhub service
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - jupyterhub_start
  tags: jh_start
