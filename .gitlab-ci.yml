image: docker:20.10.16

variables:
  # When you use the dind service, you must instruct Docker to talk with
  # the daemon started inside of the service. The daemon is available
  # with a network connection instead of the default
  # /var/run/docker.sock socket. Docker 19.03 does this automatically
  # by setting the DOCKER_HOST in
  # https://github.com/docker-library/docker/blob/d45051476babc297257df490d22cbd806f1b11e4/19.03/docker-entrypoint.sh#L23-L29
  #
  # The 'docker' hostname is the alias of the service container as described at
  # https://docs.gitlab.com/ee/ci/services/#accessing-the-services.
  #
  # Specify to Docker where to create the certificates. Docker
  # creates them automatically on boot, and creates
  # `/certs/client` to share between the service and job
  # container, thanks to volume mount from config.toml
  DOCKER_TLS_CERTDIR: "/certs"

services:
  - docker:20.10.16-dind

stages:
  - lint
  - test
  - posttest
  
molecule-lint:
  stage: lint
  before_script:
    - mkdir -p build/reports
    - apk add --no-cache python3 python3-dev py3-pip gcc git curl build-base autoconf automake py3-cryptography linux-headers musl-dev libffi-dev openssl openssl-dev tar bzip2 unzip
    - ln -s /usr/bin/python3 /usr/bin/python
    - docker info
    - python3 --version
    - pip install --no-cache-dir -r requirements-dev.txt
    - ansible-galaxy install -r requirements.yml
    - ansible --version
    - molecule --version
  script:
    - molecule lint
    - ansible-lint-junit ansible-lint.txt -o build/reports/linting.xml
  artifacts:
    paths:
      - build/reports/
    expire_in: 1 day

molecule-test-centos:
  stage: test
  before_script:
    - apk add --no-cache python3 python3-dev py3-pip gcc git curl build-base autoconf automake py3-cryptography linux-headers musl-dev libffi-dev openssl openssl-dev tar bzip2 unzip
    - ln -s /usr/bin/python3 /usr/bin/python
    - docker info
    - python3 --version
    - pip install --no-cache-dir -r requirements-dev.txt
    - ansible-galaxy install -r requirements.yml
    - ansible --version
    - molecule --version
    - mkdir -p admin
    - cp .ci/slurmcontroller.dhparam.pem admin/
  script:
    - molecule --debug test
  after_script:
    - ls -la build
    - ls -la build/reports
  artifacts:
    paths:
      - build/reports/
    expire_in: 1 day

