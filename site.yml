---
# This playbook deploys JupyterHub.

- name: Validate environment
  hosts: jupyterhub_hosts
  gather_facts: yes
  roles:
    - env_validation
  tags: always

- name: Gather facts from all the nodes
  hosts: all

- name: Run common tasks
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - common
  tags: common
  
- name: Install jupyterhub
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - install_jupyterhub
  tags: install_jh

- name: Configure jupyterhub
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - configure_jupyterhub
  tags: config_jh
  
- name: Install SSL keys and certificates
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - install_certs
  tags: certs_jh

- name: Install nginx
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - nginx
  tags: nginx

- name: Start jupyterhub service
  hosts: jupyterhub_hosts
  gather_facts: no
  roles:
    - start_jupyterhub
  tags: start_jh
