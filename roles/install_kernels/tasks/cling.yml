---

# Setup for install C++ kernel using Xeux Cling
  
- name: setup conda environment for xeus cling
  conda:
    name: python
    version: "{{ conda_env_py_version }}"
    environment: "{{ cling_pkg_path }}"
    state: present
    executable: "{{ conda_prefix }}/bin/conda"
  become: true
  tags: "cling_kernel"
  
- name: install xeus cling in cling environment
  conda:
    name: xeus-cling
    version: "{{ cling_version }}"
    environment: "{{ cling_pkg_path }}"
    state: present
    executable: "{{ conda_prefix }}/bin/conda"
  become: true
  tags: "cling_kernel"
  
- name: install xeus cling kernels into jupyterhub environment
  shell: "source {{ conda_prefix }}/etc/profile.d/conda.sh && conda activate {{ jupyterhub_env_prefix }} && jupyter kernelspec install {{ cling_pkg_path }}/share/jupyter/kernels/{{ item }} --sys-prefix"
  become: true
  register: cling
  changed_when: "'error' not in cling.stderr"
  with_items:
     - "xcpp17"
     # Provide only Cpp 17 for the moment
     # - "xcpp14"
     # I had problems when I tested xcpp11 kernel
     # - "xcpp11"
  tags: "cling_kernel"