---

# This playbook creates service user for jupyterhub

- name: create the jupyter group
  group:
    name: "{{ jupyterhub_service_user }}"
    state: present
    system: true
  become: true

- name: create jupyter service user
  user:
    name: "{{ jupyterhub_service_user }}"
    groups: "{{ jupyterhub_service_user }}"
    append: true
    state: present
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  become: true

- name: add command alias for spawner command
  lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: "^Cmnd_Alias {{ item.name }}"
    line: "Cmnd_Alias {{ item.name }} = {{ slurm_bin_path }}/{{ item.cmd }}"
    validate: "visudo -cf %s"
  become: true
  with_items:
    - "{{ slurm_cmds }}"

- name: add line to give jupyter user permission to use sudo for batchspawner
  lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: "^{{ jupyterhub_service_user }} ALL=(ALL)"
    line: "{{ jupyterhub_service_user }} ALL=(ALL) NOPASSWD:SETENV: {{ slurm_cmds | map(attribute='name') | join(',') }}"
    validate: "visudo -cf %s"
  become: true
