---

# Install grafana loki

- name: download loki release
  get_url:
    url: "{{ loki_download }}"
    dest: "/tmp/{{ loki_archive }}"
    checksum: "sha256:{{ loki_download_github }}/v{{ loki_version }}/SHA256SUMS"
    mode: '0644'
  become: true
  register: download_release
  until: download_release is succeeded
  retries: 5
  delay: 2

- name: unpack loki release
  unarchive:
    src: "/tmp/{{ loki_archive }}"
    dest: "/tmp"
    creates: "/tmp/{{ loki_bin }}"
    remote_src: true
    mode: '0644'
  become: true

- name: copy loki to /usr/local/bin
  copy:
    src: "/tmp/{{ loki_bin }}"
    dest: "/usr/local/bin/loki"
    mode: '0755'
    owner: root
    group: root
    remote_src: true
  become: true
  notify: restart systemd loki
  
- name: clean-up
  file:
    path: "/tmp/{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ loki_archive }}"
    - "{{ loki_bin }}"

- name: install systemd-unit
  template:
    src: "systemd-loki.j2"
    dest: "/etc/systemd/system/loki.service"
    mode: '0644'
  become: true
  notify:
    - reload systemd loki
