---

# PostgreSQL related variables

# DB Data dir
postgresql_data_dir: "/var/lib/postgresql/data"

# Initialise DB
postgresql_init_cmd_matrix:
  Debian:
    "11": "/usr/lib/postgresql/13/bin/initdb -D {{ postgresql_data_dir }}"
    "12": "/usr/lib/postgresql/15/bin/initdb -D {{ postgresql_data_dir }}"
    "13": "/usr/lib/postgresql/17/bin/initdb -D {{ postgresql_data_dir }}"
  Ubuntu:
    "22": "/usr/lib/postgresql/14/bin/initdb -D {{ postgresql_data_dir }}"
    "24": "/usr/lib/postgresql/16/bin/initdb -D {{ postgresql_data_dir }}"

# Initialise DB
postgresql_init_cmd: "{{ postgresql_init_cmd_matrix[ansible_facts.distribution][ansible_facts.distribution_major_version] }}"

# Postgresql service unit file name
postgresql_service_unit_matrix:
  Debian:
    "11": postgresql@13-main
    "12": postgresql@15-main
    "13": postgresql@17-main
  Ubuntu:
    "22": postgresql@14-main
    "24": postgresql@16-main

postgresql_service_unit: "{{ postgresql_service_unit_matrix[ansible_facts.distribution][ansible_facts.distribution_major_version] }}"
