---

- name: Create the node_exporter group
  group:
    name: "{{ _node_exporter_system_group }}"
    state: present
    system: true
  become: true
  tags: "setup_node_exp"

- name: Create the node_exporter user
  user:
    name: "{{ _node_exporter_system_user }}"
    groups: "{{ _node_exporter_system_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  become: true
  tags: "setup_node_exp"

- name: make sure /etc/node_exporter/ssl exists
  file:
    path: "{{ remote_path_node_exporter_ssl }}/"
    state: "{{ item }}"
    owner: "{{ _node_exporter_system_user }}"
    group: "{{ _node_exporter_system_user }}"
    mode: 0700
  become: true
  tags: "setup_node_exp"
  with_items:
    - directory
    - touch
    
- name: check if SSL key exists
  stat:
    path: "{{ local_path_node_exporter_ssl }}/{{ ssl_key_name_node_exporter }}"
  delegate_to: localhost
  register: key_path
  tags: "setup_node_exp"

- name: fail when key file does not exist
  fail:
   msg: "ssl.key cannot be found."
  when: not key_path.stat.exists
  tags: "setup_node_exp"

- name: check if SSL cert exists
  stat:
    path: "{{ local_path_node_exporter_ssl }}/{{ ssl_cert_name_node_exporter }}"
  delegate_to: localhost
  register: cert_path
  tags: "setup_node_exp"

- name: fail when cert file does not exist
  fail:
   msg: "ssl.cert cannot be found."
  when: not cert_path.stat.exists
  tags: "setup_node_exp"
  
- name: install SSL key
  copy:
    src: "{{ local_path_node_exporter_ssl }}/{{ ssl_key_name_node_exporter }}"
    dest: "{{ remote_path_node_exporter_ssl }}/{{ ssl_key_name_node_exporter }}"
    owner: "{{ _node_exporter_system_group }}"
    group: "{{ _node_exporter_system_group }}"
    mode: 0600
  become: true
  tags: "setup_node_exp"

- name: install SSL certificate
  copy:
    src: "{{ local_path_node_exporter_ssl }}/{{ ssl_cert_name_node_exporter }}"
    dest: "{{ remote_path_node_exporter_ssl }}/{{ ssl_cert_name_node_exporter }}"
    owner: "{{ _node_exporter_system_group }}"
    group: "{{ _node_exporter_system_group }}"
    mode: 0600
  become: true
  tags: "setup_node_exp"
  
- name: install SSL CA certificate
  copy:
    src: "{{ local_path_node_exporter_ssl }}-ca/{{ ssl_cert_name_node_exporter.split('.')[0] }}-ca.crt"
    dest: "{{ remote_path_ca_cert_ssl }}/{{ ssl_cert_name_node_exporter.split('.')[0] }}-ca.crt"
    owner: root
    group: root
    mode: 0644
  become: true
  when: self_signed_certs
  tags: "setup_node_exp"
