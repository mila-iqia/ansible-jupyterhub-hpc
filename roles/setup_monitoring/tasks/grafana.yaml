---

- name: create grafana system group
  group:
    name: grafana
    system: true
    state: present
  become: true
  tags: "setup_grafana"

- name: create grafana system user
  user:
    name: grafana
    system: true
    shell: "/usr/sbin/nologin"
    group: grafana
    createhome: false
  become: true
  tags: "setup_grafana"

- name: make sure /etc/grafana/ssl exists
  file:
    path: "{{ remote_path_grafana_ssl }}/"
    state: "{{ item }}"
    owner: grafana
    group: grafana
    mode: '0700'
  become: true
  tags: "setup_grafana"
  with_items:
    - directory
    - touch
  
- name: install SSL key
  copy:
    src: "{{ local_path_grafana_ssl }}/{{ ssl_key_name_grafana }}"
    dest: "{{ remote_path_grafana_ssl }}/{{ ssl_key_name_grafana }}"
    owner: grafana
    group: grafana
    mode: '0600'
  become: true
  tags: "setup_grafana"

- name: install SSL certificate
  copy:
    src: "{{ local_path_grafana_ssl }}/{{ ssl_cert_name_grafana }}"
    dest: "{{ remote_path_grafana_ssl }}/{{ ssl_cert_name_grafana }}"
    owner: grafana
    group: grafana
    mode: '0600'
  become: true
  tags: "setup_grafana"
  
- name: install SSL CA certificate
  copy:
    src: "{{ local_path_grafana_ssl }}-ca/{{ ssl_cert_name_grafana.split('.')[0] }}-ca.crt"
    dest: "{{ remote_path_ca_cert_ssl }}/{{ ssl_cert_name_grafana.split('.')[0] }}-ca.crt"
    owner: grafana
    group: grafana
    mode: '0644'
  become: true
  when: self_signed_certs
  tags: "setup_grafana"
