---

- name: create prometheus system group
  group:
    name: prometheus
    system: true
    state: present
  become: true
  tags: "setup_prometheus"

- name: create prometheus system user
  user:
    name: prometheus
    system: true
    shell: "/usr/sbin/nologin"
    group: prometheus
    createhome: false
  become: true
  tags: "setup_prometheus"

- name: make sure /etc/prometheus/ssl exists
  file:
    path: "{{ remote_path_prometheus_ssl }}/"
    state: "{{ item }}"
    owner: prometheus
    group: prometheus
    mode: '0700'
  become: true
  tags: "setup_prometheus"
  with_items:
    - directory
    - touch
  
- name: install SSL key
  copy:
    src: "{{ local_path_prometheus_ssl }}/{{ ssl_key_name_prometheus }}"
    dest: "{{ remote_path_prometheus_ssl }}/{{ ssl_key_name_prometheus }}"
    owner: prometheus
    group: prometheus
    mode: '0600'
  become: true
  tags: "setup_prometheus"

- name: install SSL certificate
  copy:
    src: "{{ local_path_prometheus_ssl }}/{{ ssl_cert_name_prometheus }}"
    dest: "{{ remote_path_prometheus_ssl }}/{{ ssl_cert_name_prometheus }}"
    owner: prometheus
    group: prometheus
    mode: '0600'
  become: true
  tags: "setup_prometheus"
  
- name: install SSL CA certificate
  copy:
    src: "{{ local_path_prometheus_ssl }}-ca/{{ ssl_cert_name_prometheus.split('.')[0] }}-ca.crt"
    dest: "{{ remote_path_ca_cert_ssl }}/{{ ssl_cert_name_prometheus.split('.')[0] }}-ca.crt"
    owner: prometheus
    group: prometheus
    mode: '0644'
  become: true
  when: self_signed_certs
  tags: "setup_prometheus"
  
- name: grant prometheus user permission to read jupyterhub internal certs
  acl:
    path: "{{ item.path }}"
    entity: prometheus
    etype: "user"
    permissions: "{{ item.permissions }}"
    state: present
  become: true
  tags: "setup_prometheus"
  with_items:
    - { path: "{{ jupyterhub_srv_dir }}", permissions: "rx" }
    - { path: "{{ jupyterhub_srv_dir }}/internal-certs", permissions: "rx" }
    - { path: "{{ jupyterhub_srv_dir }}/internal-certs/proxy-client", permissions: "rx" }
    - { path: "{{ jupyterhub_srv_dir }}/metrics_token", permissions: "r" }
    - { path: "{{ jupyterhub_srv_dir }}/internal-certs/hub-ca_trust.crt", permissions: "r" }
    - { path: "{{ jupyterhub_srv_dir }}/internal-certs/proxy-client/proxy-client.key", permissions: "r" }
    - { path: "{{ jupyterhub_srv_dir }}/internal-certs/proxy-client/proxy-client.crt", permissions: "r" }