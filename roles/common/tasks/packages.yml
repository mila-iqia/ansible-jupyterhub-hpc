---
# This playbook installs common packages used on a UNIX/Linux system

- name: Install common packages [RHEL]
  become: true
  when: ansible_facts.pkg_mgr in ['yum', 'dnf']
  tags:
    - install_dev_tools

  block:
    - name: Update yum [RHEL/CentOS]
      ansible.builtin.dnf:
        update_cache: true
        state: present

    - name: Install build tools [RHEL/CentOS]
      ansible.builtin.dnf:
        name: "@Development tools"
        state: present

    - name: Install other developer tools [RHEL/CentOS]
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      with_items:
        - "{{ dev_tools }}"

    - name: Install nginx web server [RHEL/CentOS]
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Install postgressql database [RHEL/CentOS]
      ansible.builtin.dnf:
        name: "{{ item }}"
        state: present
      when: use_postgresql_db
      with_items:
        - "{{ postgressql_yum_pkgs }}"

- name: Install common packages [Debian]
  become: true
  when: ansible_facts.pkg_mgr == "apt"
  tags:
    - install_dev_tools
  block:
    - name: Update apt [Debian/Ubuntu]
      ansible.builtin.apt:
        update_cache: true
        state: present

    - name: Install build tools [Debian/Ubuntu]
      ansible.builtin.apt:
        name: "build-essential"
        state: present

    - name: Install python3-debian tools [Debian/Ubuntu]
      ansible.builtin.apt:
        name: "python3-debian"
        state: present
      when:
        - ansible_facts.distribution == 'Debian' or ansible_facts.distribution == 'Ubuntu'
        - (ansible_facts.distribution_major_version | int) >= 12 or (ansible_facts.distribution_major_version | int) >= 24

    - name: Install other developer tools [Debian/Ubuntu]
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      with_items:
        - "{{ dev_tools }}"

    - name: Install nginx web server [Debian/Ubuntu]
      ansible.builtin.apt:
        name: nginx
        state: present

    - name: Install postgressql database [Debian/Ubuntu]
      ansible.builtin.apt:
        name: "{{ item }}"
        state: present
      when: use_postgresql_db
      with_items:
        - "{{ postgressql_apt_pkgs }}"
