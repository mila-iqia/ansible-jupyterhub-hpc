---

# This playbook creates service user for jupyterhub

- name: create jupyterhub service user
  user:
    name: "{{ jupyterhub_service_user }}"
    state: present
    shell: /sbin/nologin
  become: true

- name: add command alias for batchspawner
  lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: "^Cmnd_Alias JUPYTER_CMD"
    line: "Cmnd_Alias JUPYTER_CMD = {{ conda_env_prefix }}/bin/batchspawner"
    validate: "visudo -cf %s"
  become: true

- name: add line to give jupyter user permission to use sudo for batchspawner
  lineinfile:
    dest: /etc/sudoers
    state: present
    regexp: "^{{ jupyterhub_service_user }} ALL=(ALL)"
    line: "{{ jupyterhub_service_user }} ALL=(ALL) NOPASSWD:JUPYTER_CMD"
    validate: "visudo -cf %s"
  become: true
  
- name: create nginx service user
  user:
    name: "{{ nginx_service_user }}"
    state: present
    shell: /sbin/nologin
  become: true
