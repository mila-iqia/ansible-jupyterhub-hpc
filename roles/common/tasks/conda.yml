---

# This playbook installs adds conda repository and installs conda using RPMs

- name: add repository configuration file for conda
  yum_repository:
    name: conda
    description: Conda YUM repo
    file: conda
    baseurl: "{{ conda_base_url }}"
    gpgcheck: yes
    gpgkey: "{{ conda_gpgkey }}"
  become: true
  tags: "conda"

- name: install conda
  yum:
    name: conda
    update_cache: yes
    state: present
  become: true
  tags: "conda"
  
- name: add conda config
  copy:
    content: "{{ conda_config | to_yaml }}"
    dest: "{{ conda_prefix }}/.condarc"
    owner: root
    group: root
    mode: 0644
  become: true
  tags: "conda"
