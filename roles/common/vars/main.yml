---

# Conda yum repo config
conda_base_url: "https://repo.anaconda.com/pkgs/misc/rpmrepo/conda"
conda_gpgkey: "https://repo.anaconda.com/pkgs/misc/gpgkeys/anaconda.asc"

conda_config:
  channels:
    - conda-forge
    - pytorch
    - defaults
    - plotly
    - r
  show_channel_urls: yes

postgressql_pkgs:
  - "postgresql-server"
  - "python3-psycopg2"