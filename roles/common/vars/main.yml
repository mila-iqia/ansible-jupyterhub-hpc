---
# Conda GPG key
conda_gpgkey: "https://repo.anaconda.com/pkgs/misc/gpgkeys/anaconda.asc"

# Conda yum repo config
conda_yum_base_url: "https://repo.anaconda.com/pkgs/misc/rpmrepo/conda"

# Conda apt repo config
conda_apt_repo: "deb [arch=amd64 signed-by=/usr/share/keyrings/conda-archive-keyring.gpg] https://repo.anaconda.com/pkgs/misc/debrepo/conda stable main"

conda_config:
  channels:
    - conda-forge
    - pytorch
    - defaults
    - plotly
    - r
  show_channel_urls: yes

postgressql_yum_pkgs:
  - "postgresql-server"
  - "python3-psycopg2"

postgressql_apt_pkgs:
  - "postgresql"
  - "postgresql-contrib"
  - "python3-psycopg2"