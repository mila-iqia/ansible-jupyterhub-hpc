---
- name: Copy rc file with passwords to /root
  ansible.builtin.copy:
    dest: /root/jupyterhub-admin-rc
    owner: root
    group: root
    mode: "0550"
    content: |
      JUPYTERHUB_DB_PASSWD={{ jupyterhub_db_passwd }}
      NODE_EXPORTER_USER=node_exporter
      NODE_EXPORTER_PASSWD={{ node_exporter_passwd }}
      PROMETHEUS_USER=prometheus
      PROMETHEUS_PASSWD={{ prometheus_passwd }}
      GRAFANA_USER=grafana
      GRAFANA_PASSWD={{ grafana_passwd }}
  become: true
