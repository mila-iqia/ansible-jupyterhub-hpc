---

# Create all the directories necessary for configuring JupyterHub

- name: make sure /etc/jupyterhub exists
  file:
    path: "{{ jupyterhub_config_dir }}/"
    state: "{{ item }}"
    owner: "{{ jupyter_username }}"
    group: "{{ jupyter_username }}"
    mode: 0755
  become: true
  with_items:
    - directory
    - touch

- name: make sure /srv/jupyterhub exists
  file:
    path: "{{ jupyterhub_srv_dir }}/"
    state: "{{ item }}"
    owner: "{{ jupyter_username }}"
    group: "{{ jupyter_username }}"
    mode: 0700
  become: true
  with_items:
    - directory
    - touch

- name: make sure /var/log/jupyterhub exists
  file:
    path: "{{ jupyterhub_log_dir }}/"
    state: "{{ item }}"
    owner: "{{ jupyter_username }}"
    group: "{{ jupyter_username }}"
    mode: 0755
  become: true
  with_items:
    - directory
    - touch

- name: make sure /etc/jupyter/templates exists
  file:
    path: "{{ jupyter_templates_dir }}/"
    state: "{{ item }}"
    owner: "{{ jupyter_username }}"
    group: "{{ jupyter_username }}"
    mode: 0755
  become: true
  with_items:
    - directory
    - touch

- name: make sure /etc/jupyter exists
  file:
    path: "{{ jupyter_config_dir }}"
    state: "{{ item }}"
    owner: "{{ jupyter_username }}"
    group: "{{ jupyter_username }}"
    mode: 0755
  become: true
  with_items:
    - directory
    - touch

- name: make sure /etc/ipython exists
  file:
    path: "{{ipython_config_dir}}"
    state: "{{ item }}"
    owner: "{{ jupyter_username }}"
    group: "{{ jupyter_username }}"
    mode: 0755
  become: true
  with_items:
    - directory
    - touch
