---

- name: install jupyterhub config file
  template:
    src: jupyterhub_config.py.j2
    dest: "{{ jupyterhub_config_dir }}/jupyterhub_config.py"
    owner: "{{ jupyter_username }}"
    group: "{{ jupyter_username }}"
    mode: 0644
  become: true

- name: install jupyterhub cookie secret
  copy:
    src: "../../../security/cookie_secret"
    dest: "{{ jupyterhub_srv_dir }}/cookie_secret"
    owner: "{{ jupyter_username }}"
    group: "{{ jupyter_username }}"
    mode: 0600
  become: true

- name: install CHP proxy auth token
  copy:
    src: "../../../security/proxy_auth_token"
    dest: "{{ jupyterhub_srv_dir }}/proxy_auth_token"
    owner: "{{ jupyter_username }}"
    group: "{{ jupyter_username }}"
    mode: 0600
  become: true
