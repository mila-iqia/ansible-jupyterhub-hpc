---

# PostgreSQL related variables

# DB Data dir
postgresql_data_dir: "/var/lib/postgresql/data"

# Initialise DB
postgresql_init_cmd_matrix: 
  Debian: 
    '11': "/usr/lib/postgresql/13/bin/initdb -D {{ postgresql_data_dir }}"
  Ubuntu:
    '22': "/usr/lib/postgresql/14/bin/initdb -D {{ postgresql_data_dir }}"
  
# Initialise DB
postgresql_init_cmd: "{{ postgresql_init_cmd_matrix[ansible_distribution][ansible_distribution_major_version] }}"
