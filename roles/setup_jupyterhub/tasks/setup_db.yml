---

# Setup PostgresSQL database for jupyterhub

- name: check if PostgreSQL database is initialised
  stat:
    path: "/var/lib/pgsql/data"
  register: pgsql_stat
  tags: "setup_db"

- name: initialise PostgreSQL database
  shell: "postgresql-setup --initdb"
  become: true
  tags: "setup_db"
  when: not pgsql_stat.stat.exists
  notify:
   - enable postgresql

- name: ensure the PostgreSQL service is running
  service: 
    name: postgresql 
    state: started 
    enabled: yes
  become: true
  tags: "setup_db"
  
- name: create the database for jupyterhub
  postgresql_db: 
    name: "{{ jupyterhub_db_name }}"
    template: "template0"
    state: present
  become: true
  become_user: postgres
  tags: "setup_db"
  
- name: ensure user has access to the new database
  postgresql_user: 
     db: "{{ jupyterhub_db_name }}"
     name: "{{ jupyterhub_service_user }}"
     password:  "{{ lookup('env','JP_DB_PASSWD') }}"
     priv: ALL
     state: present
  become: true
  become_user: postgres
  tags: "setup_db"
     
- name: ensure user does not have unnecessary permissions
  postgresql_user: 
     name: "{{ jupyterhub_service_user }}"
     role_attr_flags: NOSUPERUSER,NOCREATEDB
     state: present
  become: true
  become_user: postgres
  tags: "setup_db"
  
- name: use md5 as authentication method for databases on localhost
  lineinfile:
    dest: "/var/lib/pgsql/data/pg_hba.conf"
    state: present
    regexp: "^{{ item.oldentry }}"
    line: "{{ item.newentry }}"
  become: true
  tags: "setup_db"
  with_items:
    - { oldentry: "host    all             all             127.0.0.1/32            ident", newentry: "host    all             all             127.0.0.1/32            md5" }
    - { oldentry: "host    all             all             ::1/128                 ident", newentry: "host    all             all             ::1/128                 md5" }
  notify:
   - restart postgresql
