---
  
- name: Create the node_exporter group
  group:
    name: "{{ _node_exporter_system_group }}"
    state: present
    system: true
  become: true

- name: Create the node_exporter user
  user:
    name: "{{ _node_exporter_system_user }}"
    groups: "{{ _node_exporter_system_group }}"
    append: true
    shell: /usr/sbin/nologin
    system: true
    create_home: false
  become: true

- name: make sure /etc/node_exporter/ssl exists
  file:
    path: "/etc/node_exporter/ssl/{{ item }}"
    state: directory
    owner: "{{ _node_exporter_system_user }}"
    group: "{{ _node_exporter_system_group }}"
    mode: 0700
  become: true
  with_items:
    - "cert"
    - "private"
  
- name: install TLS key
  copy:
    src: "{{ local_tls_dir }}/{{ inventory_hostname }}/{{ inventory_hostname }}.key"
    dest: "/etc/node_exporter/ssl/private/{{ inventory_hostname }}.key"
    owner: "{{ _node_exporter_system_user }}"
    group: "{{ _node_exporter_system_group }}"
    mode: 0600
  become: true

- name: install TLS certificate
  copy:
    src: "{{ local_tls_dir }}/{{ inventory_hostname }}/{{ inventory_hostname }}.crt"
    dest: "/etc/node_exporter/ssl/cert/{{ inventory_hostname }}.crt"
    owner: "{{ _node_exporter_system_user }}"
    group: "{{ _node_exporter_system_group }}"
    mode: 0600
  become: true
  
- name: set node exporter TLS configuration
  set_fact:
    node_exporter_tls_server_config: "{{ { 'cert_file': '/etc/node_exporter/ssl/cert/' + inventory_hostname + '.crt', 'key_file': '/etc/node_exporter/ssl/private/' + inventory_hostname + '.key' } }}"
    
- name: set node exporter basic auth configuration
  set_fact:
    node_exporter_basic_auth_users: "{{ { 'node_exporter': lookup('file', local_passwds_dir + '/' + inventory_hostname + '_node_exporter_passwd') | trim } }}"
