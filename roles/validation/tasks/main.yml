---
# This playbook validates the ansible version in environment

- name: Check if ansible version >= 2.1
  delegate_to: localhost
  ansible.builtin.assert:
    that: (ansible_version.major, ansible_version.minor) >= (2, 1)
    msg: "require ansible >= 2.1, found {{ ansible_version.full }}"

- name: Make sure we are running on CentOS {8,9}/RHEL {8,9,10}/ Debian {11,12}/ Ubuntu {22,24}
  ansible.builtin.assert:
    that: (ansible_facts.os_family, ansible_facts.distribution_major_version) in [('RedHat', '8'), ('RedHat', '9'), ('RedHat', '10'), ('Debian', '11'), ('Debian', '12'), ('Debian', '22'), ('Debian', '24')]
    msg: "This ansible setup only work on CentOS {8,9}/RHEL {8,9}/ Debian {11,12}/ Ubuntu {22,24}"
