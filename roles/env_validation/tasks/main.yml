---
# This playbook validates the ansible version in environment

- name: check if ansible version >= 2.1
  delegate_to: localhost
  assert:
    that: (ansible_version.major, ansible_version.minor) >= (2, 1)
    msg: "require ansible >= 2.1, found {{ ansible_version.full }}"

- name: make sure we are running on CentOS/RHEL
  fail: 
    msg: "This ansible setup only work on CentOS/RHEL"
  when: ansible_os_family != 'RedHat'
  
- name: check if jp-adminrc exists on ansible host
  delegate_to: localhost
  stat:
    path: "lookup('env', 'PWD')/encryption/jp-adminrc"
  register: rcfile_stat
  
- name: make sure jp-adminrc exists on ansible host
  fail: 
    msg: "jp-adminrc file not found in encryption/ folder. Please generate one by running gen-encrypt-data script"
  when: ansible_os_family != 'RedHat'
  
- name: make sure we sourced jp-adminrc file
  delegate_to: localhost
  assert:
    that: lookup('env', "JP_NODE_EXPORTER_USER") | length > 0
    msg: "Please source jp-adminrc file in encryption folder"
  when: install_mon_stack
  
- name: check if jupyterhub cookie secret exists
  delegate_to: localhost
  stat:
    path: "{{ local_path_tokens }}/cookie_secret"
  register: cookie_path

- name: fail when cookie_path file does not exist
  fail:
   msg: "jupyterhub cookie_secret cannot be found in {{ local_path_tokens }} directory. Please generate one by running gen-encrypt-data script"
  when: not cookie_path.stat.exists
  
- name: check if CHP proxy auth token exists
  delegate_to: localhost
  stat:
    path: "{{ local_path_tokens }}/proxy_auth_token"
  register: auth_token_path

- name: fail when auth_token_path file does not exist
  fail:
   msg: "CHP auth proxy token cannot be found in {{ local_path_tokens }} directory. Please generate one by running gen-encrypt-data script"
  when: not auth_token_path.stat.exists
  
- name: check if crypt keys exist
  delegate_to: localhost
  stat:
    path: "{{ local_path_tokens }}/crypt_key"
  register: crypt_key_path

- name: fail when crypt_key file does not exist
  fail:
   msg: "Crypt keys cannot be found in {{ local_path_tokens }} directory. Please generate one by running gen-encrypt-data script"
  when: not crypt_key_path.stat.exists
  
- name: check if prometheus metrics API token exists
  delegate_to: localhost
  stat:
    path: "{{ local_path_tokens }}/metrics_token"
  register: metrics_token

- name: fail when prometheus metrics API token does not exist
  fail:
   msg: "Metrics API token cannot be found in {{ local_path_tokens }} directory. Please generate one by running gen-encrypt-data script"
  when: not metrics_token.stat.exists and install_mon_stack
  
- name: check if SSL key exists
  delegate_to: localhost
  stat:
    path: "{{ local_path_nginx_proxy_ssl }}/{{ ssl_key_name_nginx_proxy }}"
  register: key_path

- name: fail when key file does not exist
  fail:
   msg: "ssl.key cannot be found at {{ local_path_nginx_proxy_ssl }} directory. Please generate one by running gen-encrypt-data script"
  when: not key_path.stat.exists

- name: check if SSL cert exists
  delegate_to: localhost
  stat:
    path: "{{ local_path_nginx_proxy_ssl }}/{{ ssl_cert_name_nginx_proxy }}"
  register: cert_path

- name: fail when cert file does not exist
  fail:
   msg: "ssl.cert cannot be found at {{ local_path_nginx_proxy_ssl }} directory. Please generate one by running gen-encrypt-data script"
  when: not cert_path.stat.exists
  
- name: check if Diffie-Hellman key exists
  delegate_to: localhost
  stat:
    path: "{{ local_path_encryption_data }}/{{ ssl_dhparam_name_nginx_proxy }}"
  register: dhparam_path

- name: fail when Diffie-Hellman key does not exist
  fail:
   msg: "dhparam.pem cannot be found at {{ local_path_encryption_data }} directory. Please generate one by running gen-encrypt-data script"
  when: not dhparam_path.stat.exists
