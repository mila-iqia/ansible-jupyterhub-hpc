---
# This playbook validates the ansible version in environment
  
- name: check if SSL key exists
  delegate_to: localhost
  stat:
    path: "{{ local_path_nginx_proxy_ssl }}/{{ ssl_key_name_nginx_proxy }}"
  register: key_path

- name: fail when key file does not exist
  fail:
   msg: "ssl.key cannot be found at {{ local_path_nginx_proxy_ssl }} directory. Please generate one by running gen-encrypt-data script"
  when: not key_path.stat.exists

- name: check if SSL cert exists
  delegate_to: localhost
  stat:
    path: "{{ local_path_nginx_proxy_ssl }}/{{ ssl_cert_name_nginx_proxy }}"
  register: cert_path

- name: fail when cert file does not exist
  fail:
   msg: "ssl.cert cannot be found at {{ local_path_nginx_proxy_ssl }} directory. Please generate one by running gen-encrypt-data script"
  when: not cert_path.stat.exists
  
- name: check if Diffie-Hellman key exists
  delegate_to: localhost
  stat:
    path: "{{ local_path_encryption_data }}/{{ ssl_dhparam_name_nginx_proxy }}"
  register: dhparam_path

- name: fail when Diffie-Hellman key does not exist
  fail:
   msg: "dhparam.pem cannot be found at {{ local_path_encryption_data }} directory. Please generate one by running gen-encrypt-data script"
  when: not dhparam_path.stat.exists
