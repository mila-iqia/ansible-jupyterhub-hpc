---

# Install nginx web server and install certificates

- name: install nginx.conf
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
    backup: yes
  become: true
  tags: "install_nginx_config"
    
- name: install user defined systemd unit file for nginx
  template:
    src: nginx.service.j2
    dest: /etc/systemd/system/nginx.service
    owner: root
    group: root
    mode: 0644
  become: true
  when: nginx_run_as_service_user
  tags: "install_nginx_config"
  notify:
    - reload nginx
    - restart nginx
