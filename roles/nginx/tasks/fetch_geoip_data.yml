---

# Fetch GeoIP data

- name: make sure /etc/nginx/geoip exists
  file:
    path: "{{ remote_path_geoip_data }}/"
    state: "{{ item }}"
    owner: root
    group: root
    mode: 0700
  become: true
  with_items:
    - directory
    - touch

- name: download GeoIP data
  get_url:
    url: "{{ geoip_url }}"
    dest: "/tmp/{{ geoip_archive }}"
    mode: '0644'
  become: true
  retries: 5
  delay: 2
  
- name: unpack GeoIP release
  shell: "gunzip /tmp/{{ geoip_archive }}"
  become: true
  
- name: copy GeoIP to /etc/nginx
  copy:
    src: "/tmp/{{ geoip_file }}"
    dest: "{{ remote_path_geoip_data }}"
    mode: 0755
    owner: root
    group: root
    remote_src: true
  become: true
    
- name: download GeoLiteCity data
  get_url:
    url: "{{ geolitecity_url }}"
    dest: "/tmp/{{ geolitecity_archive }}"
    mode: '0644'
  become: true
  retries: 5
  delay: 2
  
- name: unpack GeoLiteCity release
  shell: "gunzip /tmp/{{ geolitecity_archive }}"
  become: true
  
- name: copy GeoLiteCity to /etc/nginx
  copy:
    src: "/tmp/{{ geolitecity_file }}"
    dest: "{{ remote_path_geoip_data }}"
    mode: 0755
    owner: root
    group: root
    remote_src: true
  become: true
  
- name: clean-up
  file:
    path: "/tmp/{{ item }}"
    state: absent
  become: true
  loop:
    - "{{ geolitecity_file }}"
    - "{{ geoip_file }}"
