---

# Install nginx web server and install certificates

- name: install system nginx
  yum:
    name: nginx
    state: present
  become: true

- name: make sure /etc/nginx/ssl exists
  file:
    path: "{{ ssl_path }}/"
    state: "{{ item }}"
    owner: root
    group: root
    mode: 0700
  become: true
  with_items:
    - directory
    - touch

- name: check if SSL key exists
  stat:
    path: "{{ role_path }}/../../security/{{ ssl_key_name }}"
  delegate_to: localhost
  register: key_path

- name: fail when key file does not exist
  fail:
   msg: "ssl.key cannot be found."
  when: key_path.stat.exists == false

- name: check if SSL cert exists
  stat:
    path: "{{ role_path }}/../../security/{{ ssl_cert_name }}"
  delegate_to: localhost
  register: cert_path

- name: fail when cert file does not exist
  fail:
   msg: "ssl.cert cannot be found."
  when: cert_path.stat.exists == false

- name: install SSL key
  copy:
    src: "{{ role_path }}/../../security/{{ ssl_key_name }}"
    dest: "{{ ssl_path }}/{{ ssl_key_name }}"
    owner: root
    group: root
    mode: 0600
  become: true

- name: install SSL certificate
  copy:
    src: "{{ role_path }}/../../security/{{ ssl_cert_name }}"
    dest: "{{ ssl_path }}/{{ ssl_cert_name }}"
    owner: root
    group: root
    mode: 0600
  become: true

- name: install nginx.conf
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/nginx.conf
    owner: root
    group: root
    mode: 0644
    backup: yes
  become: true
  notify:
    - reload nginx
    - restart nginx
