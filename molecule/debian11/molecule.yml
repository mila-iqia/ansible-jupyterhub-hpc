---

dependency:
  name: galaxy
  options:
    role-file: ../../requirements.yml
driver:
  name: docker
# lint: |
#   yamllint . || exit 0
#   ansible-lint -c .ansible-lint --exclude meta --exclude ./.gitlab-ci.yml -p --nocolor | tee ansible-lint.txt || exit 0

platforms:
  - name: slurmcluster
    image: registry.gitlab.com/idris-cnrs/ci-utilities/ci-service-containers/generic/slurm-cluster:debian11
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    published_ports:
      - 8443:443
      - 9443:9443
      - 3443:3443
    hostname: slurmcluster
    privileged: true
    cgroupns_mode: host
    pre_build_image: true
    docker_networks:
      - name: "int"
        attachable: true
    network_mode: "int"
    env:
      http_proxy: ${http_proxy:-""}
      https_proxy: ${https_proxy:-""}
      HTTP_PROXY: ${HTTP_PROXY:-""}
      HTTPS_PROXY: ${HTTPS_PROXY:-""}
      no_proxy: ${no_proxy:-""}

provisioner:
  name: ansible
  config_options:
    defaults:
      remote_tmp: /tmp
      stdout_callback: yaml
      deprecation_warnings: false
      allow_broken_conditionals: true
      interpreter_python: /usr/bin/python3
      filter_plugins: ${PWD}/plugins/filter
      roles_path: ${PWD}/roles:${HOME}/.ansible/roles:/usr/share/ansible/roles:/etc/ansible/roles
  inventory:
    links:
      hosts: ../default/hostfile
      group_vars: ../../playbooks/group_vars/
  playbooks:
    prepare: ../default/prepare.yml
    converge: ../default/converge.yml
scenario:
  create_sequence:
    - dependency
    - create
    - prepare
  check_sequence:
    - dependency
    - cleanup
    - destroy
    - create
    - prepare
    - converge
    - check
    - destroy
  converge_sequence:
    - dependency
    - create
    - prepare
    - converge
  destroy_sequence:
    - dependency
    - cleanup
    - destroy
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - side_effect
    - verify
    - cleanup
    - destroy
verifier:
  name: testinfra
  directory: ../default/tests
  options:
    junitxml: "build/reports/unit-tests-debian11.xml"
