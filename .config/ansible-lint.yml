---
profile: production

# .ansible-lint
# exclude_paths included in this file are parsed relative to this file's location
# and not relative to the CWD of execution. CLI arguments passed to the --exclude
# option will be parsed relative to the CWD of execution.
exclude_paths:
  - roles/*/*/.ipynb_checkpoints/
  - molecule
  - roles/jupyterhub/tasks/install.yml
  - .gitlab-ci.yml
  - playbooks/secrets.yml
  - .ansible

warn_list:
  - galaxy[version-incorrect] # until collection gets bumped to 1.x.x
  - galaxy[no-changelog] # Unless we want to keep a changelog

skip_list:
  - var-naming[no-role-prefix] # https://github.com/ansible/ansible-lint/pull/3422#issuecomment-1549584988
  - yaml[line-length]

# List of additional kind:pattern to be added at the top of the default
# match list, first match determines the file kind.
kinds:
  - tasks: "**/tasks/*.{yml,yaml}"
  - vars: "**/vars/*.{yml,yaml}"
  - meta: "**/meta/main.{yml,yaml}"
