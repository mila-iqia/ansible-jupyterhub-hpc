---
# This playbook deploys JupyterHub and monitoring stack.

- name: Gather facts from jupyterhub hosts
  hosts: all
  gather_facts: true
  tags:
    - always

- name: Validate environment
  hosts: all
  gather_facts: false
  roles:
    - validation
  tags:
    - always

- name: Preflights
  hosts: all
  gather_facts: false
  pre_tasks:
    - name: Include secrets
      ansible.builtin.include_vars: secrets.yml
      failed_when: false
      tags:
        - always
  roles:
    - preflights
    - evandam.conda
  tags:
    - always

- name: Run common tasks
  hosts: all
  gather_facts: false
  roles:
    - common
    - mambaorg.micromamba
  tags:
    - prerequisites
    - molecule-idempotence-notest

- name: Setup jupyterhub environment
  hosts: jupyterhub
  gather_facts: false
  pre_tasks:
    - name: Include secrets
      ansible.builtin.include_vars: secrets.yml
      tags:
        - always
  roles:
    - jupyterhub
  tags:
    - jupyterhub

- name: Setup nginx reverse proxy
  hosts: nginx
  gather_facts: false
  roles:
    - nginx
  tags:
    - nginx

- name: Setup monitoring facts
  hosts: all
  gather_facts: false
  roles:
    - monitoring
  tags:
    - always

- name: Setup node_exporter
  hosts: node_exporter
  gather_facts: false
  pre_tasks:
    - name: Include secrets
      ansible.builtin.include_vars: secrets.yml
      tags:
        - always
  roles:
    - role: prometheus.prometheus.node_exporter
      when: install_mon_stack
      tags:
        - molecule-idempotence-notest
  tags:
    - node_exporter
    - monitoring

- name: Setup prometheus
  hosts: prometheus
  gather_facts: false
  pre_tasks:
    - name: Include secrets
      ansible.builtin.include_vars: secrets.yml
      tags:
        - always
  roles:
    - role: prometheus.prometheus.prometheus
      when: install_mon_stack
      tags:
        - molecule-idempotence-notest
  tags:
    - prometheus
    - monitoring

- name: Setup grafana
  hosts: grafana
  gather_facts: false
  pre_tasks:
    - name: Include secrets
      ansible.builtin.include_vars: secrets.yml
      tags:
        - always
  roles:
    - role: grafana.grafana.grafana
      when: install_mon_stack
      tags:
        - molecule-idempotence-notest
  tags:
    - grafana
    - monitoring

- name: Setup logrotate
  hosts: all
  gather_facts: false
  roles:
    - logrotate
  tags:
    - logrotate

- name: Run post deploy steps
  hosts: jupyterhub
  gather_facts: false
  pre_tasks:
    - name: Include secrets
      ansible.builtin.include_vars: secrets.yml
      tags:
        - always
  roles:
    - role: post_deploy
  tags:
    - always
    - notest
