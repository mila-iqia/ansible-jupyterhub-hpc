# ---------------------------------------------------
# Prometheus configuration
# ---------------------------------------------------

# If we are using this playbook to add configuration
# to existing Prometheus installation make sure we set all
# configuration details same as the existing configuration
# The scrape configs for the node exporter and jupyterhub
# will be added to existing scrape configs

# Prometheus related config
prometheus_version: "3.5.0"
prometheus_http_port: "9090"
prometheus_http_address: "localhost"
prometheus_storage_retention: "30d"
prometheus_storage_retention_size: "10GB"
