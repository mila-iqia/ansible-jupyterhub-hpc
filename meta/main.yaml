---

galaxy_info:
  author: Mahendra Paipuri
  role_name: ansible-jupyterhub
  description: Installs JupyterHub along with custom SLURM spawner on HPC platforms. The role additionally can deploy node exporter, prometheus and grafana stack to monitor the jupyterhub node.
  license: Apache
  company: CNRS
  min_ansible_version: 2.5
  platforms:
    - name: EL
      versions:
        - 8
  galaxy_tags:
    - jupyterhub
    - hpc
    - slurm
    - monitoring
    - prometheus
    - grafana
    - loki

dependencies:
    - evandam.conda
    - cloudalchemy.prometheus
    - cloudalchemy.node_exporter
    - cloudalchemy.grafana
    - patrickjahns.promtail
